# rGoldenHeads Configuration
#
# Two rules that will save you time:
#   1. Adding, removing or renaming an item -- or changing its command, aliases or
#      permission -- needs a full server RESTART. Commands are registered into the
#      server's command tree once, at startup. /rgoldenheads reload cannot change them.
#   2. Items already sitting in a player's inventory NEVER change. Every property below
#      is baked into the item the moment it is given. Reloading changes what the NEXT
#      /goldenhead hands out, not the one already in someone's hotbar.
#
# Text values (display-name, lore, messages) accept either format:
#   MiniMessage - "<gold>Golden Head</gold> <gray>(tasty)</gray>"      (recommended)
#   Legacy      - "&6Golden Head &7(tasty)"                            (&#ff8800 works too)
# A string is treated as legacy as soon as it contains an & colour code; otherwise it is
# parsed as MiniMessage. Do not mix the two in one string.

# Bump-guard. Do not edit. If this does not match the version the plugin expects, a
# warning is logged so you know to diff your file against the new default.
config-version: 2

# Logs every item as it is built on load and reload. Useful when an item is not behaving
# the way you configured it. Noisy; leave false in production.
debug: false

# What to do when the player's inventory has no room for the item.
#   true  - drop the leftovers at the player's feet
#   false - give only what fits, discard the rest, and tell the player their inventory is full
drop-overflow: true

# Once per server start, asks Modrinth (api.modrinth.com) whether a newer rGoldenHeads
# release exists for your Minecraft version, and tells the console and anyone with
# rgoldenheads.admin.notify when they join. Nothing is sent except the request itself
# (which, like any web request, reveals your server's IP to Modrinth). Set to false to
# disable it entirely.
update-checker:
  enabled: true

# When a player dies, drop their own head wearing their skin, ready to craft into a Golden
# Head. Off by default.
player-heads:
  drop-on-death: false
  # true = only when another player made the kill; deaths to lava, falls or mobs drop nothing
  only-player-kills: false
  # The classic UHC head pole: instead of dropping, the head is set on a post where the player
  # died. Breaking the head gives the skinned head item. When there's no room (e.g. the player
  # died inside a wall), the head drops as an item instead. Region protection is not checked.
  head-pole:
    enabled: false
    # Any block; a nether brick fence is the traditional look
    pole: nether_brick_fence

# Unlock every recipe below in players' recipe books when they join (and after a reload), so
# they can see and click-craft them. Recipes with a permission are only shown to players who
# have it.
recipe-book:
  unlock-on-join: true

# Vanilla recipes to switch off, by id (see the recipe's name on the Minecraft wiki). For
# example, golden_apple removes the 8-ingot golden apple recipe, so the Light Apple below is
# the only way to craft one. Remove an id and reload to bring the recipe back.
disabled-vanilla-recipes:
#  - golden_apple


# ---------------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------------
# Placeholders in <angle brackets> are filled in for you: <item> is the item's display-name
# with its colours, the rest are plain text. A message missing from this list falls back
# to its default. Set any message to "" to silence it, and prefix to "" to remove the tag.
messages:
  prefix: ""
  players-only: "<red>Only players can receive items."
  no-permission: "<red>You don't have permission to do that."
  item-received: "<green>You received <item><green>."
  inventory-full: "<red>Your inventory is full."
  inventory-full-dropped: "<yellow>Your inventory was full, so the item dropped at your feet."
  item-unavailable: "<red>That item is no longer available. Ask an admin to check the configuration."
  reload-success: "<green>Configuration reloaded."
  reload-failed: "<red>Reload failed. See the console for details; the previous items are still active."
  usage: "<yellow>Usage: /<label> reload | /<label> give {player|*} {item} [amount]"
  # /rgoldenheads give
  given-to-player: "<green>Gave <amount>x <item><green> to <player>."
  given-to-all: "<green>Gave <amount>x <item><green> to <count> online player(s)."
  player-not-found: "<red>No online player is named <player>."
  no-players-online: "<red>Nobody is online."
  unknown-item: "<red>Unknown item '<id>'. Available: <items>"
  invalid-amount: "<red>The amount must be a whole number from 1 to <max>."
  # Shown on join to players with rgoldenheads.admin.notify
  update-available: "<yellow>rGoldenHeads <latest> is available (you have <current>): <url>"


# ---------------------------------------------------------------------------
# Head skins
# ---------------------------------------------------------------------------
# Items pick a skin by name with head-skin: <name>. Two are built in:
#   modern   - the default since 2.1 (source: https://namemc.com/skin/7e3c84ef1342fb4d)
#   classic  - the look rGoldenHeads shipped with before 2.1
# To go back to the old look, change head-skin: modern to head-skin: classic on the items
# below and run /rgoldenheads reload.
#
# Add your own skins here and use them by name. texture is the base64 "value" field from a
# head database site; uuid is optional (a stable one is derived from the texture). Defining
# modern or classic here replaces the built-in one.
head-skins:
  # my_skin:
  #   texture: "e3RleHR1cmVzOntTS0lOOnt1cmw6Imh0dHA6Ly..."


# ---------------------------------------------------------------------------
# Items
# ---------------------------------------------------------------------------
# Add as many entries as you like. The key (e.g. golden_head) is the item's ID: it must
# use only lowercase a-z 0-9 . _ - / characters, it identifies the item internally, and
# it is written into the item so the plugin can recognise it later.
#
# Per-item keys -- everything except command and material may be left out:
#   enabled           true/false. false = no command, no permission. Default: true
#   command           the command label, without the slash. REQUIRED, must be unique.
#   aliases           extra labels for the same command. Must also be unique.
#   description       shown in /help. Default: "Gives you <id>"
#   permission        permission node needed. Default: rgoldenheads.give.<id>
#   display-name      the item's name. Default: the id
#   lore              list of lore lines. Default: none
#   material          vanilla item id, e.g. GOLDEN_CARROT or minecraft:golden_apple. REQUIRED
#   item-model        overrides the rendered model, e.g. minecraft:player_head. Default: unset
#   head-skin         a skin name from head-skins above (built in: modern, classic).
#                     Only meaningful together with item-model: minecraft:player_head
#   head-texture      a raw base64 skin blob instead of a named skin; wins over head-skin
#   head-uuid         optional, with head-texture. Leave it out and a stable UUID is derived
#                     from the texture, which is what you want in almost every case
#   glint             true/false to force the enchantment shimmer on or off.
#                     Omit entirely to leave it at the vanilla default
#   amount            how many are given per command. 1 to the material's stack size. Default: 1
#   instant           true = swallowed with no eating animation at all. Default: false
#   eat-seconds       how long eating takes. Vanilla food is 1.6. Ignored when instant is true
#   animation         NONE, EAT, DRINK, BLOCK, BOW, TRIDENT, CROSSBOW, SPYGLASS, TOOT_HORN,
#                     BRUSH, BUNDLE, SPEAR. Omit for the vanilla default. SPEAR is the spear
#                     animation only on 1.21.11+; older servers show the trident one for it.
#                     An unavailable value logs the list your server actually supports
#   nutrition         hunger points restored. Default: 0
#   saturation        saturation restored. Default: 0.0
#   can-always-eat    true = edible on a full hunger bar, like a golden apple. Default: true
#   consume-particles true/false for the eating particles. Omit for the vanilla default
#   consume-sound     e.g. minecraft:entity.generic.eat. Omit for the vanilla default
#   cooldown-seconds  use-cooldown after eating. Omit entirely for no cooldown at all
#   cooldown-group    items sharing a group share one cooldown bar.
#                     Default: rgoldenheads:<id>, i.e. each item cools down on its own
#   effect-chance     0.0 to 1.0 probability the effects apply at all. Default: 1.0
#   effects           list of { type, level, duration } -- see below
#
# Effects use human numbers, not internal ones:
#   type      potion id, e.g. regeneration, absorption, speed, instant_health
#             (REGENERATION also works -- case and the minecraft: prefix are optional)
#   level     1 = the plain effect, 2 = II, 3 = III. Starts at 1, not 0
#   duration  SECONDS. Use -1 for an infinite effect
#   ambient / particles / icon   optional true/false. Default: false / true / true

items:

  golden_head:
    enabled: true
    command: goldenhead
    description: Gives you a Golden Head
    permission: rgoldenheads.give.goldenhead
    display-name: "&6Golden Head &7(&c❤❤❤❤&e❤❤&7)"
    material: GOLDEN_CARROT
    item-model: minecraft:player_head
    head-skin: modern
    eat-seconds: 1.0
    nutrition: 0
    saturation: 0.0
    can-always-eat: true
    cooldown-seconds: 10.0
    effects:
      # Regeneration III for 5s heals 4 red hearts
      - type: regeneration
        level: 3
        duration: 5
      # Absorption I grants 2 yellow hearts
      - type: absorption
        level: 1
        duration: 120

  instant_golden_head:
    enabled: true
    command: instantgoldenhead
    aliases: [instanthead]
    description: Gives you an Instant Golden Head
    permission: rgoldenheads.give.instantgoldenhead
    display-name: "&bInstant Golden Head"
    material: GOLDEN_CARROT
    item-model: minecraft:player_head
    head-skin: modern
    # instant: true is shorthand for eat-seconds: 0.0 plus animation: NONE
    instant: true
    nutrition: 0
    saturation: 0.0
    can-always-eat: true
    cooldown-seconds: 12.0
    effects:
      - type: regeneration
        level: 3
        duration: 10
      - type: absorption
        level: 2
        duration: 120
      - type: speed
        level: 1
        duration: 5

  custom_golden_apple:
    enabled: true
    command: goldenapple
    aliases: [customgapple]
    description: Gives you a custom Golden Apple
    permission: rgoldenheads.give.goldenapple
    display-name: "&6Golden Apple"
    material: GOLDEN_APPLE
    # 1.6s is the vanilla food eat duration, so this eats like a normal golden apple
    eat-seconds: 1.6
    nutrition: 0
    saturation: 0.0
    can-always-eat: true
    # No cooldown-seconds key at all = no use cooldown on this item
    effects:
      - type: regeneration
        level: 2
        duration: 10
      - type: absorption
        level: 1
        duration: 120


# ---------------------------------------------------------------------------
# Recipes
# ---------------------------------------------------------------------------
# Crafting-table recipes (crafters work too). Unlike items, recipes can be added, removed
# and changed with /rgoldenheads reload; no restart needed. The key (e.g. golden_head) is the
# recipe's ID and must use only lowercase a-z 0-9 . _ - / characters.
#
# Per-recipe keys -- everything except result, shape and ingredients may be left out:
#   enabled       true/false. Default: true
#   result        what the recipe makes:
#                   rgoldenheads:<item id>  one of the items above, e.g. rgoldenheads:golden_head
#                   <vanilla item>          e.g. golden_apple or minecraft:golden_apple
#   amount        how many one craft makes. 1 to the item's stack size. Default: 1
#   display-name  vanilla results only: renames the result. Leave it out for the plain vanilla
#                 item, which stacks with the ones players already have
#   lore          vanilla results only: list of lore lines
#   permission    permission node needed to craft it. Leave it out (or "") for everyone.
#                 Gated recipes can't be crafted in a crafter, which has no player to check
#   shape         up to 3 rows of up to 3 characters, all rows the same length. Each character
#                 stands for an ingredient; a space is an empty slot
#   ingredients   what each shape character means (see below)
#   shapeless     true = ingredients is a plain list and their placement doesn't matter.
#                 shape is then not used. Default: false
#
# An ingredient is one of:
#   gold_ingot                a vanilla item
#   [gold_ingot, gold_block]  any one of these
#   "#minecraft:planks"       any item in an item tag (quote it: # starts a YAML comment)
#   rgoldenheads:golden_head  one of the items above, and only that: a plain golden carrot
#                             does not count, and a Golden Head never counts as a plain
#                             golden carrot in any recipe here
#
# Two recipes with the same grid cannot both work, so the later one is skipped with a
# warning: that's why instant_golden_head ships disabled. A grid that matches a vanilla
# recipe is reported in the console too.
#
# Example of a shapeless recipe:
#   example:
#     result: rgoldenheads:custom_golden_apple
#     shapeless: true
#     ingredients: [golden_apple, glistering_melon_slice]

recipes:

  # A player head surrounded by 8 gold ingots
  golden_head:
    enabled: true
    result: rgoldenheads:golden_head
    amount: 1
    shape:
      - "GGG"
      - "GHG"
      - "GGG"
    ingredients:
      G: gold_ingot
      H: player_head

  # Same grid as golden_head. To hand out Instant Golden Heads instead, disable golden_head
  # and enable this one.
  instant_golden_head:
    enabled: false
    result: rgoldenheads:instant_golden_head
    amount: 1
    shape:
      - "GGG"
      - "GHG"
      - "GGG"
    ingredients:
      G: gold_ingot
      H: player_head

  # Light Apple: a normal golden apple for half the gold. The vanilla 8-ingot recipe still works
  # unless you add golden_apple to disabled-vanilla-recipes above.
  light_apple:
    enabled: true
    result: golden_apple
    amount: 1
    # Uncomment to tell them apart. A renamed apple no longer stacks with normal golden apples.
    # display-name: "<gold>Light Golden Apple"
    shape:
      - " G "
      - "GAG"
      - " G "
    ingredients:
      G: gold_ingot
      A: apple

  # The pre-1.9 Notch apple recipe: a golden apple surrounded by 8 gold blocks. The result is
  # the real vanilla Enchanted Golden Apple.
  enchanted_golden_apple:
    enabled: true
    result: enchanted_golden_apple
    amount: 1
    shape:
      - "BBB"
      - "BAB"
      - "BBB"
    ingredients:
      B: gold_block
      A: golden_apple
